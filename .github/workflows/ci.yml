name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  #  Linux build (headless OpenGL via Mesa)
  # ──────────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libgl1-mesa-dev libglu1-mesa-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxext-dev \
            python3

      - name: Configure
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -Wno-dev

      - name: Build
        run: cmake --build build --parallel

      - name: Verify binary exists
        run: test -f build/CosmicPlayground

  # ──────────────────────────────────────────────────────────────────────────────
  #  macOS build
  # ──────────────────────────────────────────────────────────────────────────────
  build-macos:
    name: Build (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake
        run: brew install cmake ninja

      - name: Configure
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -Wno-dev

      - name: Build
        run: cmake --build build --parallel

      - name: Verify binary exists
        run: test -f build/CosmicPlayground
